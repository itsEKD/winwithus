{% extends 'admin/admin_base.html' %}
{% block content %}
  <div class="container">
    <h3 class="mb-4">All Blog Posts</h3>
    <a href="{{ url_for('admin.create_post') }}" class="btn btn-primary mb-3">+ New Post</a>

    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for post in posts %}
        <tr>
          <td>{{ post.title }}</td>
          <td>{{ post.author or 'N/A' }}</td>
          <td>{{ post.created_at.strftime('%Y-%m-%d') }}</td>
          <td>
            <a href="{{ url_for('admin.edit_post', post_id=post.id) }}" class="btn btn-sm btn-warning">Edit</a>
            <form method="POST" action="{{ url_for('admin.delete_post', post_id=post.id) }}" class="d-inline" onsubmit="return confirm('Delete this post?');">
              <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4" class="text-center">No posts available.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
